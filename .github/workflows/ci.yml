name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  swift:
    name: Swift build and tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build
        run: ./scripts/swift.sh build
      # No OMNIMEM_TEST_MONGO_URI here: the database tests report as skipped.
      - name: Test
        run: ./scripts/swift.sh test

  frontend:
    name: Mission Control typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build

  scripts:
    name: Shell and Python syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: for f in install.sh scripts/*.sh .githooks/*; do bash -n "$f"; done
      - run: python3 -m py_compile scripts/*.py Tests/*.py
